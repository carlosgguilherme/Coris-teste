# Publica a API Laravel (pasta backend) no Azure App Service a cada push na main.
# Configuração no GitHub (Settings > Secrets and variables > Actions):
#   - variável AZURE_WEBAPP_NAME: nome do App Service
#   - secret AZURE_WEBAPP_PUBLISH_PROFILE: conteúdo do perfil de publicação baixado no portal
name: Deploy da API na Azure

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/azure-api.yml']
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Instala as dependências
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Publica no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

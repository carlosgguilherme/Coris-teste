services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: coris_seguros
      MYSQL_USER: coris
      MYSQL_PASSWORD: coris123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: coris_seguros
      DB_USERNAME: coris
      DB_PASSWORD: coris123
      CORS_ALLOWED_ORIGIN: "*"
      APP_DEBUG: "false"
      JWT_SECRET: segredo-local-do-docker-com-mais-de-32-caracteres
      ADMIN_NOME: Administrador
      ADMIN_EMAIL: admin@seguroviagem.com
      ADMIN_SENHA: Admin@123
    ports:
      - "8000:80"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql-data:
